[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logement"
version = "0.1.0"
description = "Site d'information sur le logement, l'énergie et les aides publiques en France, à partir de données ouvertes."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "requests>=2.31",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14.0",
    "python-dotenv>=1.0",
    # Lecture du shapefile ARCEP, qui porte à la fois les données fibre et les
    # contours de la carte : la chaîne standard en dépend.
    "pyshp>=2.3",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]
postgres = [
    "psycopg[binary]>=3.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
