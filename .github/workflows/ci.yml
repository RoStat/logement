name: Contrôles

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  # Une nouvelle poussée annule la vérification précédente de la même branche :
  # seul le dernier état importe.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Lint et tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

      - name: Fiche des aides
        # Sans réseau : structure et absence de montants uniquement.
        run: python -m src.ingest.aides
